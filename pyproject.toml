[project]
name = "kbot"
version = "0.1.0"
description = "한국어 기반 국내·미국 주식 분석 및 자동매매 봇 (모의투자 우선)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pykrx>=1.2.9",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "import-linter>=2.0",
    "ruff>=0.6",
]

[project.scripts]
kbot = "kbot.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 한글은 폭 2로 계산되어 실제 길이와 어긋남

# ─────────────────────────────────────────────────────────────
# 설계 원칙을 코드로 강제하는 import 계약 (tests/contracts 에서 검사)
# ─────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "kbot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "리스크·주문 계층은 LLM/분석 계층을 import할 수 없다 (LLM 단독 주문 경로 차단)"
type = "forbidden"
source_modules = ["kbot.risk", "kbot.execution"]
forbidden_modules = ["kbot.llm", "kbot.analysis", "anthropic"]

[[tool.importlinter.contracts]]
name = "전략 계층은 LLM을 직접 호출할 수 없다 (저장된 특성값만 읽음)"
type = "forbidden"
source_modules = ["kbot.strategy", "kbot.backtest"]
forbidden_modules = ["kbot.llm", "anthropic"]

[[tool.importlinter.contracts]]
name = "Anthropic SDK는 kbot.llm.client 한 곳에서만 사용한다 (예산 우회 차단)"
type = "forbidden"
source_modules = [
    "kbot.core", "kbot.storage", "kbot.data", "kbot.analysis", "kbot.strategy",
    "kbot.backtest", "kbot.risk", "kbot.execution", "kbot.journal", "kbot.portfolio",
    "kbot.interfaces", "kbot.app", "kbot.settings",
    "kbot.llm.budget", "kbot.llm.pricing", "kbot.llm.router", "kbot.llm.errors",
]
forbidden_modules = ["anthropic"]
# 상위 계층이 kbot.llm.factory → client 를 통해 간접적으로 쓰는 것은 허용 (직접 import만 금지)
allow_indirect_imports = true
